[package]
name = "sky-service"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.91"
async-nats = "0.35.1"
bytes = "1.8.0"
chrono = { version = "0.4.38", features = ["serde"] }
chrono-tz = { version = "0.9.0", features = ["serde"] }
env_logger = "0.11.5"
futures-util = "0.3.31"
log = "0.4.22"
messages-common = { path = "../messages-common" }
serde = "1.0.213"
serde_json = "1.0.132"
thiserror = "1.0.65"
tokio = { version = "1.41.0", features = ["rt-multi-thread"] }
