[workspace]
resolver = "3"

members = [
    "version-common",
    "messages-common",
    "api",
    "spot-finder",
    "sky-service",
]

[workspace.dependencies]
version-common = { path = "version-common" }
messages-common = { path = "messages-common" }

anyhow = "1.0.102"
async-nats = "0.46.0"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.11.9"
futures = "0.3.32"
futures-util = "0.3.32"
log = "0.4.29"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }

