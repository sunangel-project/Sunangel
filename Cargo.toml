[workspace]
resolver = "3"

members = [
    "version-common",
    "messages-common",
    "api",
    "spot-finder",
    "sky-service",
]

[workspace.dependencies]
version-common = { path = "version-common" }
messages-common = { path = "messages-common" }

anyhow = "1.0.104"
async-nats = "0.50.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.11.11"
futures = "0.3.34"
futures-util = "0.3.34"
log = "0.4.33"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

