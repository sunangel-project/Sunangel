on:
  push:
    branches:
      - "renovate-config"
  schedule:
    - cron: "40 * * * *"

enable-email-notifications: true

jobs:
  run-renovate:
    runs-on: debian
    steps:
      - name: Setup go
        uses: https://data.forgejo.org/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: https://github.com/actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.29"
          cache: false

      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Run renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
        run: |
          set -x

          LOG_LEVEL=debug npx renovate \
            --platform "forgejo" \
            --endpoint "${{ forge.api_url }}" \
            "${{ forge.repository }}" \
            "${{ forge.repository_owner }}/horizon"
