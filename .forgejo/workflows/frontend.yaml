on:
  push:
    branches:
      - latest
  pull_request:

enable-email-notifications: true

jobs:
  build-frontend:
    runs-on: dagger
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build frontend
        run: dagger call build-frontend

  deploy-frontend:
    runs-on: dagger

    needs:
      - build-frontend

    if: forge.ref_name == 'latest'

    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy frontend
        env:
          TOKEN: ${{ forge.token }}
        run: dagger call deploy-frontend --token env://TOKEN
