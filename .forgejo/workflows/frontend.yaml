on: [push]

jobs:
  build-frontend:
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: |
          set +x

          cd front
          bun ci
          bun run build

      - uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: frontend-dist
          path: ./front/dist

  deploy-frontend:
    runs-on: debian

    needs:
      - build-frontend

    if: forge.ref_name == 'forgejo-workflows' # TODO: switch to latest branch

    steps:
      - uses: https://data.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: frontend-dist

      - run: |
          set +x

          mkdir dist
          unzip frontend-dist -d dist

      - uses: actions/git-pages@v2
        with:
          site: https://sunn.cloudsftp.de/
          server: pages.energiesandsuch.com
          token: ${{ forge.token }}
          source: ./dist/
