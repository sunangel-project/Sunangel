on: [push]

jobs:
  build-frontend:
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: |
          set +x

          cd front
          bun ci
          bun run build

      - uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: frontend-dist
          path: ./front/dist

  deploy-frontend:
    runs-on: debian

    needs:
      - build-frontend

    if: forge.event_name == 'push' && contains(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3
        with:
          name: frontend-dist

      - run: |
          set +x

          mkdir dist
          unzip frontend-dist -d dist
          ls -l dist

      - uses: actions/git-pages@v2
        with:
          site: https://sunn.cloudsftp.de/
          server: pages.energiesandsuch.com
          token: ${{ forge.token }}
          source: ./dist/
