[package]
name = "api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
juniper = { version = "0.16.1", features = ["chrono", "chrono-tz"] }
juniper_graphql_ws = "0.4.0"
juniper_actix = { version = "0.6.0", features = ["subscriptions"] }
actix-web = { version = "4.10.2", features = ["openssl"] }
actix-cors = "0.7.1"
chrono = { version = "0.4.40", features = ["serde"] }
chrono-tz = { version = "0.8.6", features = ["serde"] }
async-nats = "0.38.0"
futures-util = "0.3.31"
serde = "1.0.219"
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4"] }
messages-common = { path = "../messages-common" }
version-common = { path = "../version-common" }
futures = "0.3.31"
log = "0.4.27"
anyhow = "1.0.98"
bytes = "1.10.1"
env_logger = "0.11.8"
async-stream = "0.3.6"
openssl = "0.10.72"
dotenv = "0.15.0"

