[package]
name = "api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
juniper = { version = "0.16.1", features = ["chrono", "chrono-tz"] }
juniper_graphql_ws = "0.4.0"
juniper_actix = { version = "0.6.0", features = ["subscriptions"] }
actix-web = { version = "4.9.0", features = ["openssl"] }
actix-cors = "0.7.0"
chrono = { version = "0.4.38", features = ["serde"] }
chrono-tz = { version = "0.8.6", features = ["serde"] }
async-nats = "0.35.1"
futures-util = "0.3.30"
serde = "1.0.209"
serde_json = "1.0.127"
uuid = { version = "1.10.0", features = ["v4"] }
messages-common = { path = "../messages-common" }
futures = "0.3.30"
log = "0.4.22"
anyhow = "1.0.86"
bytes = "1.7.1"
env_logger = "0.11.5"
async-stream = "0.3.5"
openssl = "0.10.66"

