[package]
name = "api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
juniper = { version = "0.16.1", features = ["chrono", "chrono-tz"] }
juniper_graphql_ws = "0.4.0"
juniper_actix = { version = "0.6.0", features = ["subscriptions"] }
actix-web = { version = "4.9.0", features = ["openssl"] }
actix-cors = "0.7.0"
chrono = { version = "0.4.40", features = ["serde"] }
chrono-tz = { version = "0.8.6", features = ["serde"] }
async-nats = "0.38.0"
futures-util = "0.3.31"
serde = "1.0.218"
serde_json = "1.0.139"
uuid = { version = "1.15.1", features = ["v4"] }
messages-common = { path = "../messages-common" }
version-common = { path = "../version-common" }
futures = "0.3.31"
log = "0.4.26"
anyhow = "1.0.96"
bytes = "1.10.0"
env_logger = "0.11.6"
async-stream = "0.3.6"
openssl = "0.10.71"

