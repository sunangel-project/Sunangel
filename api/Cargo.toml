[package]
name = "api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
juniper = { version = "0.17.0", features = ["chrono", "chrono-tz"] }
juniper_graphql_ws = "0.5.0"
juniper_actix = { version = "0.7.0", features = ["subscriptions"] }
actix-web = { version = "4.11.0", features = ["openssl"] }
actix-cors = "0.7.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
async-nats = "0.42.0"
futures-util = "0.3.31"
serde = "1.0.228"
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["v4"] }
messages-common = { path = "../messages-common" }
version-common = { path = "../version-common" }
futures = "0.3.31"
log = "0.4.28"
anyhow = "1.0.100"
bytes = "1.10.1"
env_logger = "0.11.8"
async-stream = "0.3.6"
openssl = "0.10.74"
dotenv = "0.15.0"

